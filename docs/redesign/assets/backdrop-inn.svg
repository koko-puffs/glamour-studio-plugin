<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Context only: an inn room in the game, softly out of focus (lamplight, wood, a night window). Not part of the design. -->
  <defs>
    <filter id="b" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="22"/></filter>
    <radialGradient id="lamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffcf8a" stop-opacity=".9"/><stop offset=".35" stop-color="#e48a3c" stop-opacity=".45"/><stop offset="1" stop-color="#e48a3c" stop-opacity="0"/></radialGradient>
    <radialGradient id="moon" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#9fb6ff" stop-opacity=".55"/><stop offset="1" stop-color="#3b4a8a" stop-opacity="0"/></radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1410"/><stop offset=".62" stop-color="#2e2018"/><stop offset=".63" stop-color="#3a281b"/><stop offset="1" stop-color="#1a110c"/></linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#wall)"/>
  <g filter="url(#b)">
    <rect x="980" y="120" width="360" height="380" rx="20" fill="#1d2a52"/>
    <rect x="1000" y="140" width="150" height="160" fill="#2b3f78"/>
    <rect x="1170" y="140" width="150" height="160" fill="#2b3f78"/>
    <circle cx="1160" cy="300" r="260" fill="url(#moon)"/>
    <rect x="80" y="520" width="620" height="260" rx="40" fill="#5a2f2a"/>
    <rect x="60" y="470" width="660" height="80" rx="30" fill="#e9dcc8" opacity=".55"/>
    <rect x="820" y="560" width="200" height="300" rx="16" fill="#3d2a1c"/>
    <circle cx="880" cy="430" r="230" fill="url(#lamp)"/>
    <circle cx="300" cy="230" r="170" fill="url(#lamp)" opacity=".55"/>
    <rect x="0" y="860" width="1600" height="140" fill="#120c09"/>
    <ellipse cx="560" cy="700" rx="90" ry="230" fill="#0f0b14" opacity=".75"/>
    <circle cx="560" cy="460" r="46" fill="#3a2a3a" opacity=".8"/>
    <rect x="1380" y="380" width="160" height="480" rx="12" fill="#2a1c13"/>
  </g>
  <rect width="1600" height="1000" fill="#0c0a12" opacity=".28"/>
</svg>
