<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <!-- The holo: bands of violet, periwinkle and ice, swirled like oil on water. A tile: the
       mock-ups lay it as a background and slide it about to make it shift. -->
  <defs>
    <linearGradient id="bands" x1="0" y1="0" x2="160" y2="120" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0" stop-color="#8b6cff" />
      <stop offset=".22" stop-color="#9db4ff" />
      <stop offset=".42" stop-color="#8ce2ff" />
      <stop offset=".58" stop-color="#a99bff" />
      <stop offset=".78" stop-color="#b791ff" />
      <stop offset="1" stop-color="#8b6cff" />
    </linearGradient>
    <filter id="swirl" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0055 0.009" numOctaves="2" seed="11" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="190" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  <rect x="-160" y="-160" width="800" height="800" fill="url(#bands)" filter="url(#swirl)" />
</svg>
